<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Krest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Themify Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lykmapipo/themify-icons@0.1.2/css/themify-icons.css">
</head>
<body class="m-0 font-sans bg-[#0a0a0a] text-white flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-[46px] bg-[#141414] flex flex-col h-screen border-r border-[#242424] transition-[width] duration-300 ease-in-out whitespace-nowrap z-[100] shrink-0">
        <ul class="list-none p-0 mt-[44px] mb-0">
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-3 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[0.95rem] text-[#e67e22] min-w-[46px] text-center fa fa-sitemap"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-xs">Overview</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-3 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[0.95rem] text-[#e67e22] min-w-[46px] text-center fa fa-dollar-sign"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-xs">Earnings</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-3 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[0.95rem] text-[#e67e22] min-w-[46px] text-center fa fa-credit-card"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-xs">Wallet</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-3 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[0.95rem] text-[#e67e22] min-w-[46px] text-center fa fa-id-card"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-xs">Investments</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-3 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[0.95rem] text-[#e67e22] min-w-[46px] text-center fa fa-lock"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-xs">Security</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-3 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[0.95rem] text-[#e67e22] min-w-[46px] text-center fa fa-user-plus"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-xs">Referrals</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-3 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[0.95rem] text-[#e67e22] min-w-[46px] text-center fa fa-times"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-xs">Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden min-w-0">
        <!-- Navbar -->
        <nav class="bg-[#181818] h-[40px] flex justify-between items-center px-4 border-b border-[#252525] shrink-0">
            <button id="sidebarToggle" type="button" class="bg-transparent border-0 text-[#d4d4d4] text-[0.9rem] cursor-pointer p-0 hover:text-white">
                <i class="fa fa-bars"></i>
            </button>
            <div class="flex items-center gap-4">
                <a href="#" class="text-[#8e8e8e] text-[0.85rem] no-underline hover:text-white">
                    <i class="fa fa-envelope"></i>
                </a>
                <div class="text-[#cfcfcf] text-[0.75rem] cursor-pointer flex items-center gap-1 hover:text-white">
                    <span>Hi, DndkdKdm</span>
                    <i class="fa fa-chevron-down text-[0.65rem] text-[#8e8e8e]"></i>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto pb-6 bg-[#0c0c0c]">

            <!-- TradingView Ticker Tape -->
            <div class="px-2.5 pt-2.5 sm:px-4 sm:pt-3">
                <div class="h-[36px] border border-[#222222] bg-[#111111] overflow-hidden">
                    <!-- TradingView Widget BEGIN -->
                    <div class="tradingview-widget-container h-full w-full">
                        <div class="tradingview-widget-container__widget h-full w-full"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                        {
                            "symbols": [
                                { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500 Index" },
                                { "proName": "FOREXCOM:NSXUSD", "title": "US 100 Cash CFDs" },
                                { "proName": "FX_IDC:EURUSD", "title": "EUR to USD" },
                                { "proName": "BITSTAMP:BTCUSD", "title": "Bitcoin" },
                                { "proName": "BITSTAMP:ETHUSD", "title": "Ethereum" }
                            ],
                            "showSymbolLogo": true,
                            "isTransparent": true,
                            "displayMode": "adaptive",
                            "colorTheme": "dark",
                            "locale": "en"
                        }
                        </script>
                    </div>
                    <!-- TradingView Widget END -->
                </div>
            </div>

            <!-- Dashboard Stats Cards -->
            <div class="flex flex-col gap-2.5 px-2.5 pt-3 pb-2 sm:px-4 sm:pt-3.5">
                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[3px] border-l-[#ff9800] px-3.5 py-2.5 flex justify-between items-center">
                    <div class="flex flex-col gap-0.5">
                        <span class="text-[0.6rem] font-bold uppercase tracking-[0.7px] text-[#ff9800]">AVAILABLE EARNINGS</span>
                        <span class="text-[1.05rem] sm:text-[1.15rem] font-normal text-white leading-tight">₹ INR : 200,000.00</span>
                    </div>
                    <i class="text-[1.15rem] text-[#f0f0f0] fa fa-dollar-sign"></i>
                </div>

                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[3px] border-l-[#f1c40f] px-3.5 py-2.5 flex justify-between items-center">
                    <div class="flex flex-col gap-0.5">
                        <span class="text-[0.6rem] font-bold uppercase tracking-[0.7px] text-[#f1c40f]">BTC EQUIVALENT</span>
                        <span class="text-[1.05rem] sm:text-[1.15rem] font-normal text-white leading-tight">0.040000 BTC</span>
                    </div>
                    <i class="text-[1.15rem] text-[#f0f0f0] fab fa-btc"></i>
                </div>

                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[3px] border-l-[#2ecc71] px-3.5 py-2.5 flex justify-between items-center">
                    <div class="flex flex-col gap-0.5">
                        <span class="text-[0.6rem] font-bold uppercase tracking-[0.7px] text-[#2ecc71]">INVESTED</span>
                        <span class="text-[1.05rem] sm:text-[1.15rem] font-normal text-white leading-tight">₹ INR : 20,000.00</span>
                    </div>
                    <i class="text-[1.15rem] text-[#f0f0f0] fa fa-dollar-sign"></i>
                </div>

                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[3px] border-l-[#3498db] px-3.5 py-2.5 flex justify-between items-center">
                    <div class="flex flex-col gap-0.5">
                        <span class="text-[0.6rem] font-bold uppercase tracking-[0.7px] text-[#3498db]">ACCOUNT LEVEL</span>
                        <span class="text-[1.05rem] sm:text-[1.15rem] font-normal text-white leading-tight">Standard</span>
                    </div>
                    <i class="text-[1.15rem] text-[#f0f0f0] fa fa-university"></i>
                </div>
            </div>

            <!-- TradingView Advanced Chart -->
            <div class="px-2.5 sm:px-4 h-[350px] sm:h-[420px] mt-1">
                <!-- TradingView Widget BEGIN -->
                <div class="tradingview-widget-container h-full w-full">
                    <div class="tradingview-widget-container__widget h-[calc(100%-32px)] w-full"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                    {
                        "autosize": true,
                        "symbol": "COINBASE:BTCUSD",
                        "interval": "D",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "backgroundColor": "rgba(10, 10, 10, 1)",
                        "gridColor": "rgba(42, 46, 57, 0.08)",
                        "hide_top_toolbar": false,
                        "hide_legend": false,
                        "save_image": false,
                        "container_id": "tradingview_chart",
                        "support_host": "https://www.tradingview.com"
                    }
                    </script>
                </div>
                <!-- TradingView Widget END -->
            </div>

        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var toggleBtn = document.getElementById('sidebarToggle');
            var sidebar = document.getElementById('sidebar');

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('expanded');
                    sidebar.classList.toggle('w-[210px]');
                    sidebar.querySelectorAll('span').forEach(function(label) {
                        label.classList.toggle('opacity-100');
                    });
                });
            }
        });
    </script>

</body>
</html>
