<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Krest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Themify Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lykmapipo/themify-icons@0.1.2/css/themify-icons.css">
</head>
<body class="m-0 font-sans bg-[#0a0a0a] text-white flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-[56px] bg-[#141414] flex flex-col h-screen border-r border-[#242424] transition-[width] duration-300 ease-in-out whitespace-nowrap z-[100] shrink-0">
        <ul class="list-none p-0 mt-[52px] mb-0">
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-4 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[1.15rem] text-[#e67e22] min-w-[56px] text-center fa fa-sitemap"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-sm">Overview</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-4 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[1.15rem] text-[#e67e22] min-w-[56px] text-center fa fa-dollar-sign"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-sm">Earnings</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-4 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[1.15rem] text-[#e67e22] min-w-[56px] text-center fa fa-credit-card"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-sm">Wallet</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-4 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[1.15rem] text-[#e67e22] min-w-[56px] text-center fa fa-id-card"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-sm">Investments</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-4 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[1.15rem] text-[#e67e22] min-w-[56px] text-center fa fa-lock"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-sm">Security</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-4 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[1.15rem] text-[#e67e22] min-w-[56px] text-center fa fa-user-plus"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-sm">Referrals</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-4 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] overflow-hidden">
                    <i class="text-[1.15rem] text-[#e67e22] min-w-[56px] text-center fa fa-times"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-sm">Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden min-w-0">
        <!-- Navbar -->
        <nav class="bg-[#181818] h-[48px] flex justify-between items-center px-5 border-b border-[#252525] shrink-0">
            <button id="sidebarToggle" type="button" class="bg-transparent border-0 text-[#d4d4d4] text-[1.05rem] cursor-pointer p-0 hover:text-white">
                <i class="fa fa-bars"></i>
            </button>
            <div class="flex items-center gap-5">
                <a href="#" class="text-[#8e8e8e] text-[1rem] no-underline hover:text-white">
                    <i class="fa fa-envelope"></i>
                </a>
                <div class="text-[#cfcfcf] text-[0.85rem] cursor-pointer flex items-center gap-1.5 hover:text-white">
                    <span>Hi, DndkdKdm</span>
                    <i class="fa fa-chevron-down text-[0.7rem] text-[#8e8e8e]"></i>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto pb-8 bg-[#0c0c0c]">

            <!-- TradingView Ticker Tape -->
            <div class="h-[42px] border-b border-[#222222] bg-[#111111]">
                <!-- TradingView Widget BEGIN -->
                <div class="tradingview-widget-container h-full w-full">
                    <div class="tradingview-widget-container__widget h-full w-full"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                    {
                        "symbols": [
                            { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500 Index" },
                            { "proName": "FOREXCOM:NSXUSD", "title": "US 100 Cash CFDs" },
                            { "proName": "FX_IDC:EURUSD", "title": "EUR to USD" },
                            { "proName": "BITSTAMP:BTCUSD", "title": "Bitcoin" },
                            { "proName": "BITSTAMP:ETHUSD", "title": "Ethereum" }
                        ],
                        "showSymbolLogo": true,
                        "isTransparent": true,
                        "displayMode": "adaptive",
                        "colorTheme": "dark",
                        "locale": "en"
                    }
                    </script>
                </div>
                <!-- TradingView Widget END -->
            </div>

            <!-- Dashboard Stats Cards -->
            <div class="flex flex-col gap-3.5 px-3.5 pt-4 pb-3 sm:px-6 sm:pt-5">
                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[4px] border-l-[#ff9800] px-5 py-3.5 flex justify-between items-center">
                    <div class="flex flex-col gap-1">
                        <span class="text-[0.68rem] font-bold uppercase tracking-[0.8px] text-[#ff9800]">AVAILABLE EARNINGS</span>
                        <span class="text-[1.35rem] sm:text-[1.5rem] font-normal text-white leading-snug">₹ INR : 200,000.00</span>
                    </div>
                    <i class="text-[1.45rem] text-[#f0f0f0] fa fa-dollar-sign"></i>
                </div>

                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[4px] border-l-[#f1c40f] px-5 py-3.5 flex justify-between items-center">
                    <div class="flex flex-col gap-1">
                        <span class="text-[0.68rem] font-bold uppercase tracking-[0.8px] text-[#f1c40f]">BTC EQUIVALENT</span>
                        <span class="text-[1.35rem] sm:text-[1.5rem] font-normal text-white leading-snug">0.040000 BTC</span>
                    </div>
                    <i class="text-[1.45rem] text-[#f0f0f0] fab fa-btc"></i>
                </div>

                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[4px] border-l-[#2ecc71] px-5 py-3.5 flex justify-between items-center">
                    <div class="flex flex-col gap-1">
                        <span class="text-[0.68rem] font-bold uppercase tracking-[0.8px] text-[#2ecc71]">INVESTED</span>
                        <span class="text-[1.35rem] sm:text-[1.5rem] font-normal text-white leading-snug">₹ INR : 20,000.00</span>
                    </div>
                    <i class="text-[1.45rem] text-[#f0f0f0] fa fa-dollar-sign"></i>
                </div>

                <div class="bg-[#050505] border border-[#2c2c2c] border-l-[4px] border-l-[#3498db] px-5 py-3.5 flex justify-between items-center">
                    <div class="flex flex-col gap-1">
                        <span class="text-[0.68rem] font-bold uppercase tracking-[0.8px] text-[#3498db]">ACCOUNT LEVEL</span>
                        <span class="text-[1.35rem] sm:text-[1.5rem] font-normal text-white leading-snug">Standard</span>
                    </div>
                    <i class="text-[1.45rem] text-[#f0f0f0] fa fa-university"></i>
                </div>
            </div>

            <!-- TradingView Advanced Chart -->
            <div class="px-3.5 sm:px-6 h-[420px] sm:h-[520px] mt-1">
                <!-- TradingView Widget BEGIN -->
                <div class="tradingview-widget-container h-full w-full">
                    <div class="tradingview-widget-container__widget h-[calc(100%-32px)] w-full"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                    {
                        "autosize": true,
                        "symbol": "COINBASE:BTCUSD",
                        "interval": "D",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "backgroundColor": "rgba(10, 10, 10, 1)",
                        "gridColor": "rgba(42, 46, 57, 0.08)",
                        "hide_top_toolbar": false,
                        "hide_legend": false,
                        "save_image": false,
                        "container_id": "tradingview_chart",
                        "support_host": "https://www.tradingview.com"
                    }
                    </script>
                </div>
                <!-- TradingView Widget END -->
            </div>

        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var toggleBtn = document.getElementById('sidebarToggle');
            var sidebar = document.getElementById('sidebar');

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('expanded');
                    sidebar.classList.toggle('w-[240px]');
                    sidebar.querySelectorAll('span').forEach(function(label) {
                        label.classList.toggle('opacity-100');
                    });
                });
            }
        });
    </script>

</body>
</html>
