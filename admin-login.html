<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Krest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="m-0 font-sans bg-[#0a0a0a] text-white min-h-screen flex items-center justify-center p-3 sm:p-6 text-[12px] selection:bg-[#e74c3c] selection:text-white">

    <div class="w-full max-w-[380px] bg-[#141414] border border-[#262626] border-t-4 border-t-[#e74c3c] rounded-md p-4 sm:p-6 shadow-2xl">
        <!-- Brand & Heading -->
        <div class="text-center pb-3.5 mb-4 border-b border-[#242424]">
            <div class="inline-flex items-center gap-2 mb-1.5">
                <i class="fa fa-shield-alt text-[#e74c3c] text-[0.9rem]"></i>
                <span class="font-semibold tracking-wider text-sm uppercase text-white">Krest<span class="text-[#e74c3c]">.</span></span>
            </div>
            <h1 class="m-0 text-[1.1rem] sm:text-[1.2rem] font-normal text-[#e74c3c] uppercase tracking-[0.8px]">Admin Portal</h1>
        </div>

        <!-- Optional Alert Placeholder -->
        <div id="status-alert" class="hidden py-2 px-3 rounded mb-4 text-center text-[11px] bg-[#e74c3c]/20 border border-[#e74c3c] text-[#e74c3c]"></div>

        <form action="#" method="post" class="space-y-3.5">
            <div>
                <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Username</label>
                <input type="text" name="username" placeholder="Enter admin username" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#e74c3c] focus:outline-none transition-colors">
            </div>

            <div>
                <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Password</label>
                <input type="password" name="password" placeholder="Enter admin password" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#e74c3c] focus:outline-none transition-colors">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-[#e74c3c] hover:bg-[#c0392b] text-white border-0 rounded text-[11px] sm:text-[12px] font-bold cursor-pointer transition-all duration-200 mt-2 uppercase tracking-[0.8px] hover:-translate-y-px">
                Secure Login
            </button>
        </form>

        <div class="text-center mt-5 pt-3.5 border-t border-[#222222] text-[#666] text-[10px] uppercase tracking-[1.6px] font-mono">
            Krest Security
        </div>
    </div>

</body>
</html>
