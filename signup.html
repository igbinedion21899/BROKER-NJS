<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration - Krest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="m-0 font-sans bg-[#0a0a0a] text-white min-h-screen flex items-center justify-center p-3 sm:p-6 text-[12px] selection:bg-[#ff9800] selection:text-black">

    <div class="w-full max-w-[540px] bg-[#141414] border border-[#262626] rounded-md p-4 sm:p-6 shadow-2xl">
        <!-- Brand & Heading -->
        <div class="text-center pb-3.5 mb-4 border-b border-[#242424]">
            <div class="inline-flex items-center gap-2 mb-1.5">
                <i class="fa fa-broadcast-tower text-[#ff9800] text-[0.9rem]"></i>
                <span class="font-semibold tracking-wider text-sm uppercase text-white">Krest<span class="text-[#ff9800]">.</span></span>
            </div>
            <h1 class="m-0 text-[1.1rem] sm:text-[1.2rem] font-normal text-[#ff9800] uppercase tracking-[0.8px]">Member Registration</h1>
        </div>

        <!-- Optional Alert Placeholder -->
        <div id="status-alert" class="hidden py-2 px-3 rounded mb-4 text-center text-[11px]"></div>

        <form action="#" method="post">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div class="sm:col-span-2">
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">E-mail</label>
                    <input type="email" name="email" placeholder="Type your email" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                </div>

                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Surname</label>
                    <input type="text" name="surname" placeholder="Type your Surname" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                </div>

                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Last Name / Firstname</label>
                    <input type="text" name="firstname" placeholder="Type your Firstname" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                </div>

                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Phone</label>
                    <input type="text" name="phone" placeholder="Enter a valid phone number" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                </div>

                <!-- Country with Search -->
                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Country</label>
                    <input type="text" id="countrySearch" placeholder="Search country..." class="w-full py-1.5 px-2.5 mb-1.5 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] focus:border-[#ff9800] focus:outline-none transition-colors">
                    <select name="country" id="countrySelect" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                        <option value="">-- Select Country --</option>
                        <option value="Afghanistan">Afghanistan</option>
                        <option value="Albania">Albania</option>
                        <option value="Algeria">Algeria</option>
                        <option value="Argentina">Argentina</option>
                        <option value="Armenia">Armenia</option>
                        <option value="Australia">Australia</option>
                        <option value="Austria">Austria</option>
                        <option value="Azerbaijan">Azerbaijan</option>
                        <option value="Bahrain">Bahrain</option>
                        <option value="Bangladesh">Bangladesh</option>
                        <option value="Belarus">Belarus</option>
                        <option value="Belgium">Belgium</option>
                        <option value="Bolivia">Bolivia</option>
                        <option value="Brazil">Brazil</option>
                        <option value="Bulgaria">Bulgaria</option>
                        <option value="Cambodia">Cambodia</option>
                        <option value="Canada">Canada</option>
                        <option value="Chile">Chile</option>
                        <option value="China">China</option>
                        <option value="Colombia">Colombia</option>
                        <option value="Croatia">Croatia</option>
                        <option value="Cyprus">Cyprus</option>
                        <option value="Czech Republic">Czech Republic</option>
                        <option value="Denmark">Denmark</option>
                        <option value="Egypt">Egypt</option>
                        <option value="Estonia">Estonia</option>
                        <option value="Finland">Finland</option>
                        <option value="France">France</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Germany">Germany</option>
                        <option value="Ghana">Ghana</option>
                        <option value="Greece">Greece</option>
                        <option value="Hong Kong">Hong Kong</option>
                        <option value="Hungary">Hungary</option>
                        <option value="Iceland">Iceland</option>
                        <option value="India">India</option>
                        <option value="Indonesia">Indonesia</option>
                        <option value="Iran">Iran</option>
                        <option value="Iraq">Iraq</option>
                        <option value="Ireland">Ireland</option>
                        <option value="Israel">Israel</option>
                        <option value="Italy">Italy</option>
                        <option value="Japan">Japan</option>
                        <option value="Jordan">Jordan</option>
                        <option value="Kazakhstan">Kazakhstan</option>
                        <option value="Kenya">Kenya</option>
                        <option value="Kuwait">Kuwait</option>
                        <option value="Latvia">Latvia</option>
                        <option value="Lebanon">Lebanon</option>
                        <option value="Lithuania">Lithuania</option>
                        <option value="Luxembourg">Luxembourg</option>
                        <option value="Malaysia">Malaysia</option>
                        <option value="Malta">Malta</option>
                        <option value="Mexico">Mexico</option>
                        <option value="Morocco">Morocco</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="New Zealand">New Zealand</option>
                        <option value="Nigeria">Nigeria</option>
                        <option value="Norway">Norway</option>
                        <option value="Oman">Oman</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="Peru">Peru</option>
                        <option value="Philippines">Philippines</option>
                        <option value="Poland">Poland</option>
                        <option value="Portugal">Portugal</option>
                        <option value="Qatar">Qatar</option>
                        <option value="Romania">Romania</option>
                        <option value="Russia">Russia</option>
                        <option value="Saudi Arabia">Saudi Arabia</option>
                        <option value="Singapore">Singapore</option>
                        <option value="Slovakia">Slovakia</option>
                        <option value="Slovenia">Slovenia</option>
                        <option value="South Africa">South Africa</option>
                        <option value="South Korea">South Korea</option>
                        <option value="Spain">Spain</option>
                        <option value="Sri Lanka">Sri Lanka</option>
                        <option value="Sweden">Sweden</option>
                        <option value="Switzerland">Switzerland</option>
                        <option value="Taiwan">Taiwan</option>
                        <option value="Thailand">Thailand</option>
                        <option value="Turkey">Turkey</option>
                        <option value="Ukraine">Ukraine</option>
                        <option value="United Arab Emirates">United Arab Emirates</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="United States">United States</option>
                        <option value="Vietnam">Vietnam</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Choose Account Type</label>
                    <select name="account_type" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                        <option value="Mini">Mini</option>
                        <option value="Standard">Standard</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Choose the currency</label>
                    <select name="currency" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                        <option value="$ USD">$ USD</option>
                        <option value="€ EUR">€ EUR</option>
                        <option value="£ GBP">£ GBP</option>
                        <option value="&#8377; INR">&#8377; INR (India)</option>
                        <option value="¥ JPY">¥ JPY</option>
                        <option value="A$ AUD">A$ AUD</option>
                        <option value="C$ CAD">C$ CAD</option>
                        <option value="CHF">CHF</option>
                        <option value="¥ CNY">¥ CNY</option>
                        <option value="HK$ HKD">HK$ HKD</option>
                        <option value="S$ SGD">S$ SGD</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Leverage</label>
                    <select name="leverage" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                        <option value="1.1">1.1</option>
                        <option value="1.10">1.10</option>
                        <option value="1.50">1.50</option>
                        <option value="1.100">1.100</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Gender</label>
                    <select name="gender" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="sm:col-span-2">
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Password</label>
                    <input type="password" name="password" placeholder="Enter Password" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                </div>

                <div class="sm:col-span-2">
                    <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Enter Captcha</label>
                    <input type="text" name="captcha" placeholder="Enter the Captcha code below (13G91E)" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
                    <small class="text-[#ff9800] block mt-1 text-[10px] font-mono">Captcha code: 13G91E</small>
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-[#ff9800] hover:bg-[#e68a00] text-white border-0 rounded text-[11px] sm:text-[12px] font-bold cursor-pointer transition-all duration-200 mt-4 uppercase tracking-[0.8px] hover:-translate-y-px">
                Register
            </button>
        </form>

        <div class="text-center mt-5 pt-3.5 border-t border-[#222222] text-[#888] text-[11px]">
            Already have an account? <a href="#" class="text-[#ff9800] hover:underline font-medium">Login here.</a>
        </div>

        <div class="text-center mt-3 text-[10px] text-[#666] leading-relaxed">
            Copyright &copy; 2026 Krest<br>All Rights Reserved
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('countrySearch');
            const countrySelect = document.getElementById('countrySelect');
            const allOptions = Array.from(countrySelect.options);

            searchInput.addEventListener('input', function() {
                const filter = this.value.toLowerCase().trim();

                countrySelect.innerHTML = '';

                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                defaultOption.text = "-- Select Country --";
                countrySelect.add(defaultOption);

                allOptions.forEach(option => {
                    if (option.value === "") return;

                    if (option.text.toLowerCase().includes(filter)) {
                        countrySelect.add(option.cloneNode(true));
                    }
                });
            });
        });
    </script>
</body>
</html>
