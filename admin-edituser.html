<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Krest Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Themify Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lykmapipo/themify-icons@0.1.2/css/themify-icons.css">
</head>
<body class="m-0 font-sans bg-[#0a0a0a] text-white flex h-screen overflow-hidden text-[12px]">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-[34px] bg-[#141414] flex flex-col h-screen border-r border-[#242424] transition-[width] duration-300 ease-in-out whitespace-nowrap z-[100] shrink-0">
        <ul class="list-none p-0 mt-[32px] mb-0">
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-2 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] hover:border-l-2 hover:border-l-[#e74c3c] overflow-hidden">
                    <i class="text-[0.8rem] text-[#e74c3c] min-w-[34px] text-center fa fa-tachometer-alt"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-[11px]">Dashboard</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-2 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] hover:border-l-2 hover:border-l-[#e74c3c] overflow-hidden">
                    <i class="text-[0.8rem] text-[#e74c3c] min-w-[34px] text-center fa fa-users"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-[11px]">Users</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-2 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] hover:border-l-2 hover:border-l-[#e74c3c] overflow-hidden">
                    <i class="text-[0.8rem] text-[#e74c3c] min-w-[34px] text-center fa fa-arrow-down"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-[11px]">Deposits</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-2 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] hover:border-l-2 hover:border-l-[#e74c3c] overflow-hidden">
                    <i class="text-[0.8rem] text-[#e74c3c] min-w-[34px] text-center fa fa-arrow-up"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-[11px]">Withdrawals</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-2 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] hover:border-l-2 hover:border-l-[#e74c3c] overflow-hidden">
                    <i class="text-[0.8rem] text-[#e74c3c] min-w-[34px] text-center fa fa-id-card"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-[11px]">ID Verifications</span>
                </a>
            </li>
            <li class="border-b border-[#1f1f1f]">
                <a href="#" class="flex justify-start items-center py-2 px-0 text-[#d4d4d4] no-underline transition-colors duration-200 hover:bg-[#1f1f1f] hover:border-l-2 hover:border-l-[#e74c3c] overflow-hidden">
                    <i class="text-[0.8rem] text-[#e74c3c] min-w-[34px] text-center ti-close"></i>
                    <span class="opacity-0 transition-opacity duration-300 ease-in-out text-[11px]">Log Out</span>
                </a>
            </li>
        </ul>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden min-w-0 w-full">
        <!-- Navbar -->
        <nav class="bg-[#181818] h-[32px] flex justify-between items-center px-2.5 border-b border-[#252525] shrink-0">
            <button id="sidebarToggle" type="button" class="bg-transparent border-0 text-[#d4d4d4] text-[0.82rem] cursor-pointer p-0 hover:text-[#e74c3c]">
                <i class="fa fa-bars"></i>
            </button>
            <div class="flex items-center gap-2.5">
                <div class="text-[#e74c3c] text-[11px] font-bold flex items-center gap-1">
                    <span>Admin Console</span>
                    <i class="fa fa-shield-alt text-[9px]"></i>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-6 bg-[#0c0c0c] w-full min-w-0">
            <div class="mb-4 pb-3 border-b border-[#242424] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <h1 class="m-0 text-[1.15rem] sm:text-[1.3rem] font-normal text-[#e74c3c]">Edit User: Dndkd Kdm</h1>
                <a href="#" class="text-[#bbb] hover:text-white no-underline text-[11px] sm:text-[12px] inline-flex items-center gap-1.5 transition-colors">
                    <i class="fa fa-arrow-left text-[10px]"></i>
                    <span>Back to Users</span>
                </a>
            </div>

            <div class="bg-[#141414] p-3.5 sm:p-6 rounded-md border border-[#262626] max-w-[740px] mx-auto shadow-lg">
                <!-- Optional Alert Placeholder -->
                <div id="status-alert" class="hidden py-2.5 px-3 rounded mb-4 text-center text-[11px]"></div>

                <form action="#" method="post">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div class="mb-1">
                            <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">First Name</label>
                            <input type="text" value="Dndkd" disabled class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#0b0b0b] text-[#666] rounded text-[11px] sm:text-[12px] cursor-not-allowed">
                        </div>

                        <div class="mb-1">
                            <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Surname</label>
                            <input type="text" value="Kdm" disabled class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#0b0b0b] text-[#666] rounded text-[11px] sm:text-[12px] cursor-not-allowed">
                        </div>

                        <div class="mb-1">
                            <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Email</label>
                            <input type="email" value="dndkd.kdm@example.com" disabled class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#0b0b0b] text-[#666] rounded text-[11px] sm:text-[12px] cursor-not-allowed">
                        </div>

                        <div class="mb-1">
                            <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Account Type</label>
                            <select name="account_type" class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#e74c3c] focus:outline-none">
                                <option value="Standard" selected>Standard</option>
                                <option value="Premium">Premium</option>
                                <option value="VIP">VIP</option>
                            </select>
                        </div>

                        <div class="mb-1 sm:col-span-2">
                            <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Withdrawal PIN</label>
                            <input type="text" name="withdrawal_pin" value="8492" placeholder="Set withdrawal PIN" class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] font-mono focus:border-[#e74c3c] focus:outline-none">
                        </div>

                        <div class="sm:col-span-2 my-1 border-b border-[#242424]"></div>

                        <div class="mb-1">
                            <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Available Earnings (€)</label>
                            <input type="number" step="0.01" name="earnings" value="2450.00" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] font-mono focus:border-[#e74c3c] focus:outline-none">
                        </div>

                        <div class="mb-1">
                            <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Total Invested (€)</label>
                            <input type="number" step="0.01" name="invested" value="5000.00" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] font-mono focus:border-[#e74c3c] focus:outline-none">
                        </div>
                    </div>

                    <button type="submit" class="bg-[#e74c3c] hover:bg-[#c0392b] text-white border-0 py-2.5 px-4 rounded text-[11px] sm:text-[12px] font-bold cursor-pointer transition-all duration-200 w-full mt-4 uppercase tracking-[0.8px] hover:-translate-y-px">
                        Save Changes
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var toggleBtn = document.getElementById('sidebarToggle');
            var sidebar = document.getElementById('sidebar');

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('expanded');
                    sidebar.classList.toggle('w-[168px]');
                    sidebar.querySelectorAll('span').forEach(function(label) {
                        label.classList.toggle('opacity-100');
                    });
                });
            }
        });
    </script>

</body>
</html>
