<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - Krest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="m-0 font-sans bg-[#0a0a0a] text-white min-h-screen flex items-center justify-center p-3 sm:p-6 text-[12px] selection:bg-[#ff9800] selection:text-black">

    <div class="w-full max-w-[380px] bg-[#141414] border border-[#262626] rounded-md p-4 sm:p-6 shadow-2xl">
        <!-- Brand & Heading -->
        <div class="text-center pb-3.5 mb-4 border-b border-[#242424]">
            <div class="inline-flex items-center gap-2 mb-1.5">
                <i class="fa fa-broadcast-tower text-[#ff9800] text-[0.9rem]"></i>
                <span class="font-semibold tracking-wider text-sm uppercase text-white">Krest<span class="text-[#ff9800]">.</span></span>
            </div>
            <h1 class="m-0 text-[1.1rem] sm:text-[1.2rem] font-normal text-[#ff9800] uppercase tracking-[0.8px]">Member Login</h1>
        </div>

        <!-- Optional Alert Placeholder -->
        <div id="status-alert" class="hidden py-2 px-3 rounded mb-4 text-center text-[11px] bg-[#e74c3c]/20 border border-[#e74c3c] text-[#e74c3c]"></div>

        <form action="#" method="post" class="space-y-3.5">
            <div>
                <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">E-mail</label>
                <input type="email" name="email" placeholder="Enter your email" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
            </div>

            <div>
                <label class="block mb-1 text-[#bbb] text-[11px] sm:text-[12px]">Password</label>
                <input type="password" name="password" placeholder="Enter your password" required class="w-full py-2 px-3 border border-[#2c2c2c] bg-[#050505] text-white rounded text-[11px] sm:text-[12px] focus:border-[#ff9800] focus:outline-none transition-colors">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-[#ff9800] hover:bg-[#e68a00] text-white border-0 rounded text-[11px] sm:text-[12px] font-bold cursor-pointer transition-all duration-200 mt-2 uppercase tracking-[0.8px] hover:-translate-y-px">
                Login
            </button>
        </form>

        <div class="text-center mt-5 pt-3.5 border-t border-[#222222] text-[#888] text-[11px]">
            Don't have an account? <a href="#" class="text-[#ff9800] hover:underline font-medium">Register here.</a>
        </div>
    </div>

</body>
</html>
